<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spalanie"><title>Spalanie</title><style>:root{--ink:#17201c;--muted:#69736e;--cream:#f4f5f0;--green:#176b4a;--line:#e2e7e4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#dbece2,transparent 28rem),var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:480px;min-height:100svh;margin:auto;padding:max(24px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom))}.top,.meta,.title,.row button{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:28px}.small{margin:0 0 4px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.12em}h1{margin:0;font-size:32px;letter-spacing:-.04em}h2{margin:0;font-size:20px}.add{width:48px;height:48px;border:0;border-radius:50%;background:var(--ink);color:white;font-size:28px}.hero{padding:24px;border-radius:28px;background:var(--green);color:white;box-shadow:0 18px 48px #176b4a2d}.hero .small{color:#cce1d5}.big{display:flex;align-items:baseline;gap:8px;margin:8px 0 22px}.big strong{font-size:68px;line-height:1;letter-spacing:-.06em}.big span{color:#dcebe2;font-weight:700}.meta{padding-top:18px;border-top:1px solid #ffffff38;font-size:14px}.empty{text-align:center;padding:40px 24px;border-radius:28px;background:#ffffffb8}.icon{width:68px;height:68px;margin:0 auto 18px;border-radius:22px;background:#dcece3;display:grid;place-items:center;font-size:34px}.empty p{color:var(--muted);line-height:1.5}.primary{border:0;border-radius:16px;padding:15px 20px;background:var(--ink);color:white;font-weight:700}.history{margin-top:32px}.title{margin-bottom:12px}.title span,.row span,.hint{color:var(--muted);font-size:13px}.list{overflow:hidden;border-radius:22px;background:white}.row+.row{border-top:1px solid var(--line)}.row button{width:100%;padding:17px 18px;border:0;background:transparent;color:inherit;text-align:left}.row button div{display:grid;gap:5px}.result{text-align:right;white-space:nowrap}.result strong{font-size:19px}.hint{text-align:center}.hidden{display:none}.overlay{position:fixed;inset:0;z-index:3;display:flex;align-items:flex-end;justify-content:center;background:#17201c66;backdrop-filter:blur(6px)}.sheet{width:min(100%,480px);padding:12px 18px max(24px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--cream)}.sheethead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:20px}.cancel{justify-self:start;border:0;background:transparent;color:var(--green);padding:8px 0}.sheet form{display:grid;gap:14px}.sheet label{display:grid;gap:8px;color:var(--muted);font-size:13px;font-weight:700}.sheet input{width:100%;min-height:54px;border:1px solid var(--line);border-radius:16px;padding:0 16px;background:white;font-size:17px}.unit{position:relative}.unit input{padding-right:50px}.unit b{position:absolute;right:17px;top:50%;transform:translateY(-50%)}.error{margin:0;color:#a83b32;font-size:13px}.save{width:100%;min-height:54px}</style></head><body><main class="app"><header class="top"><div><p class="small">MÓJ SAMOCHÓD</p><h1>Spalanie</h1></div><button class="add" id="add">＋</button></header><section id="summary"></section><section class="history hidden" id="history"><div class="title"><h2>Historia</h2><span id="count"></span></div><div class="list" id="list"></div><p class="hint">Dotknij wpisu, aby go usunąć.</p></section></main><div class="overlay hidden" id="overlay"><section class="sheet"><div class="sheethead"><button class="cancel" id="cancel">Anuluj</button><h2>Nowe tankowanie</h2><span></span></div><form id="form"><label>Data<input id="date" type="date" required></label><label>Stan licznika<div class="unit"><input id="odo" inputmode="decimal" placeholder="np. 125000" required><b>km</b></div></label><label>Zatankowano do pełna<div class="unit"><input id="liters" inputmode="decimal" placeholder="np. 42,5" required><b>l</b></div></label><p class="error" id="error"></p><button class="primary save">Zapisz tankowanie</button></form></section></div><script>const K='spalanie-v1',$=s=>document.querySelector(s);let a=[];try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}const sort=()=>[...a].sort((x,y)=>y.o-x.o),num=(v,d=1)=>new Intl.NumberFormat('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v),dat=v=>new Intl.DateTimeFormat('pl-PL',{day:'numeric',month:'long',year:'numeric'}).format(new Date(v+'T12:00:00')),calc=(x,y)=>y&&x.o>y.o?{km:x.o-y.o,sp:x.l/(x.o-y.o)*100}:null;function render(){let s=sort(),x=s[0],r=x&&calc(x,s[1]);$('#summary').innerHTML=r?`<section class="hero"><p class="small">OD OSTATNIEGO TANKOWANIA</p><div class="big"><strong>${num(r.sp)}</strong><span>l/100 km</span></div><div class="meta"><span>Przejechano ${num(r.km,0)} km</span><span>${dat(x.d)}</span></div></section>`:`<section class="empty"><div class="icon">⛽</div><h2>${s.length?'Dodaj kolejne tankowanie':'Zacznij od licznika'}</h2><p>${s.length?'Po drugim tankowaniu zobaczysz spalanie na 100 km.':'Pierwszy wpis będzie punktem początkowym.'}</p><button class="primary" onclick="openF()">Dodaj tankowanie</button></section>`;$('#history').classList.toggle('hidden',!s.length);$('#count').textContent=s.length+(s.length===1?' wpis':' wpisy');$('#list').innerHTML=s.map((x,i)=>{let r=calc(x,s[i+1]);return `<article class="row"><button onclick="del('${x.id}')"><div><strong>${dat(x.d)}</strong><span>${num(x.o,0)} km · ${num(x.l)} l</span></div><div class="result">${r?`<strong>${num(r.sp)}</strong><span>l/100 km</span>`:'<span>Punkt startowy</span>'}</div></button></article>`}).join('')}function save(){localStorage.setItem(K,JSON.stringify(a));render()}function openF(){$('#overlay').classList.remove('hidden')}function closeF(){$('#overlay').classList.add('hidden');$('#error').textContent=''}function del(id){if(confirm('Usunąć to tankowanie?')){a=a.filter(x=>x.id!==id);save()}}$('#add').onclick=openF;$('#cancel').onclick=closeF;$('#date').value=new Date().toISOString().slice(0,10);$('#form').onsubmit=e=>{e.preventDefault();let o=Number($('#odo').value.replace(',','.')),l=Number($('#liters').value.replace(',','.')),s=sort();if(!(o>0&&l>0))return $('#error').textContent='Wpisz prawidłowe wartości.';if(s[0]&&o<=s[0].o)return $('#error').textContent='Licznik musi być większy od poprzedniego.';a.push({id:Date.now()+'',d:$('#date').value,o,l});$('#odo').value='';$('#liters').value='';save();closeF()};render()</script></body></html>
